    <script>
      // Suppress Vite HMR WebSocket errors in iframe preview environment as per environment constraints
      (function() {
        function isWsError(msg) {
          if (!msg) return false;
          if (typeof msg !== 'string') {
            try { msg = String(msg.message || msg); } catch(e) { return false; }
          }
          return msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('@vite/client');
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (event && (isWsError(event.reason) || isWsError(event.reason && event.reason.message))) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (event && (isWsError(event.message) || isWsError(event.error) || (event.filename && event.filename.includes('@vite/client')))) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
