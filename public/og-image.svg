<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#E8B84A" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#B88628" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD97A"/>
      <stop offset="50%" stop-color="#E8B84A"/>
      <stop offset="100%" stop-color="#B88628"/>
    </linearGradient>
  </defs>

  <!-- Obsidian #050505 background -->
  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- Outer Gold Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="22" fill="none" stroke="#E8B84A" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- Elongated Gold Octahedron Diamond on Right -->
  <g transform="translate(915, 315)">
    <circle cx="0" cy="0" r="172" fill="none" stroke="#E8B84A" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="0" cy="0" r="208" fill="none" stroke="#FFD97A" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
    <!-- Diamond facets -->
    <polygon points="0,-148 98,0 0,148 -98,0" fill="#E8B84A" fill-opacity="0.1" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <polygon points="0,-148 44,0 0,148 -44,0" fill="none" stroke="#FFD97A" stroke-opacity="0.65" stroke-width="1.5"/>
    <line x1="-98" y1="0" x2="98" y2="0" stroke="#FFD97A" stroke-opacity="0.7" stroke-width="1.5"/>
    <line x1="0" y1="-148" x2="0" y2="148" stroke="#FFD97A" stroke-opacity="0.45" stroke-width="1"/>
  </g>

  <!-- Brand Lockup -->
  <g transform="translate(96, 128)">
    <polygon points="18,0 36,18 18,36 0,18" fill="url(#goldGrad)"/>
    <text x="54" y="26" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" letter-spacing="8" fill="#FAFAFA">SARRAF</text>
    <text x="220" y="25" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="4" fill="#FFD97A">◆ XAU/USD</text>
  </g>

  <!-- Main Headline: "SARRAF — Gold, moving in real time" -->
  <text x="96" y="268" font-family="'Fraunces', Georgia, serif" font-size="64" font-weight="600" fill="#FAFAFA" letter-spacing="-1">
    SARRAF — Gold,
  </text>
  <text x="96" y="348" font-family="'Fraunces', Georgia, serif" font-style="italic" font-size="68" fill="#FFD97A">
    moving in real time.
  </text>

  <!-- Sub-caption -->
  <text x="96" y="418" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#A3A3A3">
    Private, invite-only XAU/USD spot telemetry, macro radar &amp; Telegram signals.
  </text>

  <!-- Bottom Telemetry Strip -->
  <g transform="translate(96, 482)" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="2">
    <rect x="0" y="0" width="210" height="44" rx="22" fill="#0d0d10" stroke="#E8B84A" stroke-opacity="0.4"/>
    <circle cx="26" cy="22" r="4.5" fill="#34d399"/>
    <text x="42" y="27" fill="#FFD97A">LIVE XAU/USD FEED</text>

    <rect x="228" y="0" width="235" height="44" rx="22" fill="#0d0d10" stroke="#E8B84A" stroke-opacity="0.28"/>
    <text x="254" y="27" fill="#FAFAFA">INVITE-ONLY VAULT</text>
  </g>
</svg>
