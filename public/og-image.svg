<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B88628"/>
      <stop offset="50%" stop-color="#FFD97A"/>
      <stop offset="100%" stop-color="#E8B84A"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E8B84A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#E8B84A" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Diamond Logo -->
  <g transform="translate(100, 110)">
    <polygon points="30,0 60,30 30,60 0,30" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="30,10 50,30 30,50 10,30" fill="url(#goldGrad)" opacity="0.3"/>
    <text x="75" y="40" font-family="'Space Mono', monospace, sans-serif" font-size="28" font-weight="bold" letter-spacing="8" fill="#FFFFFF">SARRAF</text>
    <rect x="230" y="18" width="130" height="26" rx="4" fill="#E8B84A" fill-opacity="0.12" stroke="#E8B84A" stroke-opacity="0.4"/>
    <text x="242" y="35" font-family="'Space Mono', monospace, sans-serif" font-size="11" letter-spacing="3" fill="#FFD97A">INSTITUTIONAL</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Gold, moving in
  </text>
  <text x="100" y="345" font-family="'Instrument Serif', serif" font-style="italic" font-size="68" fill="#FFD97A">
    real time.
  </text>

  <!-- Subheadline -->
  <text x="100" y="415" font-family="'Space Mono', monospace, sans-serif" font-size="16" fill="#A3A3A3" letter-spacing="1">
    XAU/USD Sub-Millisecond Stream · Algorithmic Setups · Macro Radar
  </text>

  <!-- Badges / Bottom Details -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#0088cc" fill-opacity="0.2" stroke="#29B6F6" stroke-opacity="0.5"/>
    <text x="24" y="26" font-family="'Space Mono', monospace, sans-serif" font-size="12" fill="#FFFFFF" letter-spacing="2">TELEGRAM RELAY</text>

    <rect x="190" y="0" width="180" height="42" rx="21" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="210" cy="21" r="4" fill="#34d399"/>
    <text x="225" y="26" font-family="'Space Mono', monospace, sans-serif" font-size="12" fill="#34d399" letter-spacing="2">LIVE TICK FEED</text>

    <rect x="390" y="0" width="190" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="415" y="26" font-family="'Space Mono', monospace, sans-serif" font-size="12" fill="#E8B84A" letter-spacing="2">ZERO SLIPPAGE</text>
  </g>

  <!-- Right Side Bullion & Price card preview -->
  <g transform="translate(780, 160)">
    <rect x="0" y="0" width="320" height="340" rx="16" fill="#09090d" fill-opacity="0.9" stroke="#E8B84A" stroke-opacity="0.35"/>
    <text x="25" y="45" font-family="'Space Mono', monospace, sans-serif" font-size="14" font-weight="bold" fill="#FFD97A">XAU/USD SPOT</text>
    <circle cx="280" cy="38" r="4" fill="#34d399"/>
    <text x="25" y="80" font-family="'Space Mono', monospace, sans-serif" font-size="10" fill="#737373" letter-spacing="2">INSTITUTIONAL MID</text>
    <text x="25" y="140" font-family="'Space Mono', monospace, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">$4,165.50</text>
    <text x="25" y="175" font-family="'Space Mono', monospace, sans-serif" font-size="12" fill="#34d399">+10.50 (+0.25%)</text>

    <line x1="25" y1="205" x2="295" y2="205" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="25" y="235" font-family="'Space Mono', monospace, sans-serif" font-size="11" fill="#A3A3A3">BID: $4,165.35</text>
    <text x="175" y="235" font-family="'Space Mono', monospace, sans-serif" font-size="11" fill="#A3A3A3">ASK: $4,165.65</text>
    <text x="25" y="270" font-family="'Space Mono', monospace, sans-serif" font-size="11" fill="#E8B84A">SPREAD: 0.30 pips</text>
    <text x="25" y="305" font-family="'Space Mono', monospace, sans-serif" font-size="10" fill="#737373">LONDON · NEW YORK CLEARING</text>
  </g>
</svg>
